name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  R_VERSION: "4.6.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: zig fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - run: zig build fmt

  cross-check:
    name: compile-check (5 targets)
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: cross-r-${{ env.R_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
      - name: Set R_HOME
        shell: bash
        run: echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV
      - name: Check x86_64 Linux
        if: ${{ !cancelled() }}
        run: zig build check -Dtarget=x86_64-linux
      - name: Check aarch64 Linux
        if: ${{ !cancelled() }}
        run: zig build check -Dtarget=aarch64-linux
      - name: Check x86_64 Windows
        if: ${{ !cancelled() }}
        run: zig build check -Dtarget=x86_64-windows
      - name: Check aarch64 Windows
        if: ${{ !cancelled() }}
        run: zig build check -Dtarget=aarch64-windows
      - name: Check aarch64 macOS
        if: ${{ !cancelled() }}
        run: zig build check -Dtarget=aarch64-macos

  build:
    name: build + test (Linux, R 4.6.1)
    runs-on: ubuntu-latest
    needs: fmt
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: native-r-${{ env.R_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Set R_HOME
        shell: bash
        run: echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV

      - run: zig build test

      - name: Run live R runtime tests
        run: Rscript tests/run_r_tests.R

      - name: Run explicit direct-layout tests
        run: Rscript tests/run_r_tests.R
        env:
          ZIGR_DIRECT_SEXP: "true"

  build-macos:
    name: build + test (macOS, R 4.6.1)
    runs-on: macos-latest
    needs: fmt
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: native-r-${{ env.R_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Set R_HOME
        shell: bash
        run: echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV

      - run: zig build test

  build-windows:
    name: build + test (Windows, R 4.6.1)
    runs-on: windows-latest
    needs: fmt
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: native-r-${{ env.R_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Set R paths
        shell: bash
        run: |
          rhome=$(R RHOME)
          echo "R_HOME=$rhome" >> $GITHUB_ENV
          echo "R_LIB=$rhome/bin/x64" >> $GITHUB_ENV

      - run: zig build test
