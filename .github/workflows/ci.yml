name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"

jobs:
  fmt:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build fmt

  cross-check:
    name: cross-compile (${{ matrix.target }})
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-windows
          - aarch64-windows
          - aarch64-macos
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install R headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-dev
      - name: Set R paths
        run: |
          echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV
          echo "R_INCLUDE=/usr/share/R/include" >> $GITHUB_ENV
      - run: zig build check -Dtarget=${{ matrix.target }}

  build:
    name: build + test
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set R_HOME
        shell: bash
        run: echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV

      - name: Install R packages
        run: install.packages(c("microbenchmark", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - run: zig build test

  build-macos:
    name: build + test (macOS)
    runs-on: macos-latest
    needs: fmt
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set R_HOME
        shell: bash
        run: echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV

      - name: Install R packages
        run: install.packages(c("microbenchmark", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - run: zig build test

  build-windows:
    name: build + test (Windows)
    runs-on: windows-latest
    needs: fmt
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set R paths
        shell: bash
        run: |
          rhome=$(R RHOME)
          echo "R_HOME=$rhome" >> $GITHUB_ENV
          echo "R_LIB=$rhome/bin/x64" >> $GITHUB_ENV

      - name: Install R packages
        run: install.packages(c("microbenchmark", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - run: zig build test

  benchmarks:
    name: benchmarks (system + sanity)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Set R_HOME
        shell: bash
        run: echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV

      - name: Install R packages
        run: install.packages(c("microbenchmark", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Build benchmark .so
        working-directory: benchmarks
        run: zig build -Doptimize=ReleaseFast

      - name: System diagnostics (L7)
        working-directory: benchmarks
        run: Rscript run_system_tasks.R

      - name: Sanity check (zigr subset)
        working-directory: benchmarks
        run: Rscript runner_subprocess.R --runner=zigr --tasks=1,18
