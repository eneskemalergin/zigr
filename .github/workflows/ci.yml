name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build fmt

  cross-check:
    name: cross-compile (${{ matrix.target }})
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux
          - aarch64-linux
          - x86_64-windows
          - aarch64-windows
          - aarch64-macos
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install R headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base-dev
      - name: Set R paths
        run: |
          echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV
          echo "R_INCLUDE=/usr/share/R/include" >> $GITHUB_ENV
      - run: zig build check -Dtarget=${{ matrix.target }}

  build:
    name: build + test (R ${{ matrix.r_version }})
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        r_version: [release, oldrel-1]
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r_version }}
          use-public-rspm: true
          cache: true

      - name: Set R_HOME
        shell: bash
        run: echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV

      - name: Install R packages
        run: install.packages(c("microbenchmark", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - run: zig build test

      - name: Run live R runtime tests
        run: Rscript tests/run_r_tests.R

      - name: Run checked SEXP fallback tests
        run: Rscript tests/run_r_tests.R
        env:
          ZIGR_CHECKED_SEXP: "true"

  build-macos:
    name: build + test (macOS)
    runs-on: macos-latest
    needs: fmt
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          cache: true

      - name: Set R_HOME
        shell: bash
        run: echo "R_HOME=$(R RHOME)" >> $GITHUB_ENV

      - name: Install R packages
        run: install.packages(c("microbenchmark", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - run: zig build test

  build-windows:
    name: build + test (Windows)
    runs-on: windows-latest
    needs: fmt
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          cache: true

      - name: Set R paths
        shell: bash
        run: |
          rhome=$(R RHOME)
          echo "R_HOME=$rhome" >> $GITHUB_ENV
          echo "R_LIB=$rhome/bin/x64" >> $GITHUB_ENV

      - name: Install R packages
        run: install.packages(c("microbenchmark", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - run: zig build test
